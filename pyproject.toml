[project]
name = "vpn-wizard"
version = "0.1.0"
description = "Interactive deployer for a private WireGuard VPN server"
requires-python = ">=3.12,<3.15"
dependencies = [
  "ansible-core==2.21.5",
  "argon2-cffi==25.1.0",
  "bcrypt==5.0.0",
  "cryptography==50.0.2",
  "dnspython==2.9.1",
  "httpx==0.28.1",
  "keyring==25.7.0",
  # Needed by Ansible's password_hash filter on macOS (no libxcrypt; Python 3.13 removed crypt).
  "passlib==1.7.4",
  "pyrage==1.4.0",
  "questionary==2.1.1",
  "rich==15.0.0",
  "segno==1.6.6",
]

[dependency-groups]
dev = [
  "ansible-lint==26.10.1",
  "pytest==9.2.0",
  "ruff==0.17.3",
  "yamllint==1.38.0",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "S"]
ignore = ["S603", "S607"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
