repos:
  - repo: local
    hooks:
      - id: ruff
        name: ruff
        entry: uv run ruff check
        language: system
        types: [python]
      - id: ruff-format
        name: ruff format
        entry: uv run ruff format --check
        language: system
        types: [python]
      - id: yamllint
        name: yamllint
        entry: uv run yamllint -s .
        language: system
        pass_filenames: false
        types: [yaml]
      - id: ansible-lint
        name: ansible-lint
        entry: uv run ansible-lint
        language: system
        pass_filenames: false
        files: ^ansible/
      - id: shellcheck
        name: shellcheck
        entry: shellcheck
        language: system
        types: [shell]
      - id: pytest
        name: pytest
        entry: uv run pytest -q
        language: system
        pass_filenames: false
        types: [python]
