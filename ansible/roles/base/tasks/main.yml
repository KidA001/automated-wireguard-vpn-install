---
- name: Set the hostname
  ansible.builtin.hostname:
    name: "{{ vpn_ns or 'vpn' }}"

- name: Check for cloud-init
  ansible.builtin.stat:
    path: /etc/cloud/cloud.cfg.d
  register: base_cloud_init

- name: Keep cloud-init from resetting the hostname on reboot
  ansible.builtin.copy:
    dest: /etc/cloud/cloud.cfg.d/99-vpn-hostname.cfg
    content: "preserve_hostname: true\n"
    mode: "0644"
  when: base_cloud_init.stat.exists

- name: Stop cloud-init from writing log files
  ansible.builtin.copy:
    src: 99-vpn-no-logs.cfg
    dest: /etc/cloud/cloud.cfg.d/99-vpn-no-logs.cfg
    mode: "0644"
  when: base_cloud_init.stat.exists

- name: Map the hostname to localhost
  ansible.builtin.lineinfile:
    path: /etc/hosts
    regexp: '^127\.0\.1\.1\s'
    line: "127.0.1.1 {{ vpn_ns or 'vpn' }}"

- name: Set the timezone
  community.general.timezone:
    name: "{{ timezone }}"

- name: Check whether this server was already set up
  ansible.builtin.stat:
    path: /var/lib/vpn/installed
  register: base_installed

# Later updates are installed by the nightly vpn-maintenance, which keeps re-deploys fast.
- name: Bring all packages up to date (first install only)
  ansible.builtin.apt:
    update_cache: true
    cache_valid_time: 3600
    upgrade: dist
  when: not base_installed.stat.exists

- name: Install base packages
  ansible.builtin.apt:
    name:
      - apparmor
      - apparmor-utils
      - ca-certificates
      - chrony
      - curl
      - dnsutils
      - gnupg
      - jq
      - nftables
      - sqlite3
      - systemd-zram-generator
      - wireguard-tools
    state: present

- name: Remove packages we don't need
  ansible.builtin.apt:
    name: [telnet, ftp, rsh-client, nfs-common, rpcbind]
    state: absent
    purge: true

- name: Kernel and network hardening
  ansible.builtin.template:
    src: 90-vpn-hardening.conf.j2
    dest: /etc/sysctl.d/90-vpn-hardening.conf
    mode: "0644"
  notify: Apply sysctl

- name: Disable core dumps (limits)
  ansible.builtin.copy:
    dest: /etc/security/limits.d/90-no-core.conf
    content: "* hard core 0\n"
    mode: "0644"

- name: Create the systemd-coredump drop-in directory
  ansible.builtin.file:
    path: /etc/systemd/coredump.conf.d
    state: directory
    mode: "0755"

- name: Disable core dumps (systemd-coredump)
  ansible.builtin.copy:
    dest: /etc/systemd/coredump.conf.d/90-vpn.conf
    content: "[Coredump]\nStorage=none\nProcessSizeMax=0\n"
    mode: "0644"

- name: Harden /dev/shm
  ansible.posix.mount:
    path: /dev/shm
    src: tmpfs
    fstype: tmpfs
    opts: defaults,nodev,nosuid,noexec
    state: mounted

- name: Compressed swap in RAM (zram, no swap on disk)
  ansible.builtin.copy:
    dest: /etc/systemd/zram-generator.conf
    content: |
      [zram0]
      zram-size = ram / 2
      compression-algorithm = zstd
    mode: "0644"
  notify: Start zram

- name: Enable chrony (accurate time matters for TOTP)
  ansible.builtin.systemd_service:
    name: chrony
    enabled: true
    state: started

- name: Enable AppArmor
  ansible.builtin.systemd_service:
    name: apparmor
    enabled: true
    state: started

- name: Apply pending handlers before continuing
  ansible.builtin.meta: flush_handlers

- name: Make sure zram swap is active before removing swap on disk
  ansible.builtin.systemd_service:
    name: systemd-zram-setup@zram0
    state: started

- name: List active swap
  ansible.builtin.command: swapon --show=NAME,TYPE --noheadings --raw
  register: base_swaps
  changed_when: false
  check_mode: false

- name: Turn off swap on disk (swapped-out memory could hold secrets)
  ansible.builtin.command: swapoff {{ item.split()[0] | quote }}
  loop: "{{ base_swaps.stdout_lines | reject('match', '^/dev/zram') | list }}"
  changed_when: true

- name: Remove swap entries from /etc/fstab
  ansible.builtin.lineinfile:
    path: /etc/fstab
    regexp: '^\s*[^#\s]\S*\s+\S+\s+swap\s'
    state: absent
  notify: Reload systemd

- name: Delete swap files that were in use (partitions are left alone, just disabled)
  ansible.builtin.file:
    path: "{{ item.split()[0] }}"
    state: absent
  loop: "{{ base_swaps.stdout_lines | reject('match', '^/dev/zram') | select('search', '\\sfile$') | list }}"

- name: Find provider-made swap units
  ansible.builtin.find:
    paths: /etc/systemd/system
    patterns: "*.swap"
  register: base_swap_units

- name: Remove provider-made swap units
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: absent
  loop: "{{ base_swap_units.files }}"
  loop_control:
    label: "{{ item.path }}"
  notify: Reload systemd

- name: Apply systemd changes
  ansible.builtin.meta: flush_handlers
