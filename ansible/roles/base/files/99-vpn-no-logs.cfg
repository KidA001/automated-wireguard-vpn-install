# Managed by wireguard-vpn-server: cloud-init writes no log files (warnings still go to
# stderr, which lands in the RAM-only journal).
log_cfgs:
  - - |
      [loggers]
      keys=root,cloudinit

      [handlers]
      keys=consoleHandler,cloudLogHandler

      [formatters]
      keys=arg0Formatter

      [logger_root]
      level=WARNING
      handlers=consoleHandler,cloudLogHandler

      [logger_cloudinit]
      level=WARNING
      qualname=cloudinit
      handlers=
      propagate=1

      [handler_consoleHandler]
      class=StreamHandler
      level=WARNING
      formatter=arg0Formatter
      args=(sys.stderr,)

      [handler_cloudLogHandler]
      class=NullHandler
      level=WARNING
      formatter=arg0Formatter
      args=()

      [formatter_arg0Formatter]
      format=%(asctime)s - %(filename)s[%(levelname)s]: %(message)s

output: {all: ">> /dev/null"}
