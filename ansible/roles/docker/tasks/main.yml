---
- name: Remove Debian's Docker packages if present (conflict with Docker CE)
  ansible.builtin.apt:
    name: [docker.io, docker-compose, docker-doc, podman-docker, containerd, runc]
    state: absent

- name: Create the apt keyring directory
  ansible.builtin.file:
    path: /etc/apt/keyrings
    state: directory
    mode: "0755"

- name: Add Docker's signing key
  ansible.builtin.get_url:
    url: https://download.docker.com/linux/debian/gpg
    dest: /etc/apt/keyrings/docker.asc
    mode: "0644"

- name: Add Docker's apt repository
  ansible.builtin.copy:
    dest: /etc/apt/sources.list.d/docker.sources
    mode: "0644"
    content: |
      Types: deb
      URIs: https://download.docker.com/linux/debian
      Suites: {{ ansible_facts.distribution_release }}
      Components: stable
      Architectures: {{ {'x86_64': 'amd64', 'aarch64': 'arm64'}[ansible_facts.architecture] }}
      Signed-By: /etc/apt/keyrings/docker.asc
  register: docker_repo

- name: Create /etc/docker
  ansible.builtin.file:
    path: /etc/docker
    state: directory
    mode: "0755"

- name: Configure the Docker daemon
  ansible.builtin.copy:
    dest: /etc/docker/daemon.json
    mode: "0644"
    content: "{{ docker_daemon | to_nice_json }}\n"
  vars:
    docker_daemon:
      # nftables (firewall role) owns all packet filtering and NAT.
      iptables: false
      ip6tables: false
      bridge: none
      live-restore: true
      log-driver: none
      no-new-privileges: true
      userland-proxy: false
  notify: Restart docker

- name: Install Docker CE and the compose plugin
  ansible.builtin.apt:
    name: [docker-ce, docker-ce-cli, containerd.io, docker-compose-plugin]
    state: present
    update_cache: "{{ docker_repo is changed }}"

- name: Start Docker
  ansible.builtin.systemd_service:
    name: docker
    enabled: true
    state: started

- name: Apply pending Docker changes
  ansible.builtin.meta: flush_handlers
