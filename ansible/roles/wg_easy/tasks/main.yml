---
- name: Check whether wg-easy has been initialised
  ansible.builtin.stat:
    path: "{{ wg_easy_db }}"
  register: wg_easy_db_file

- name: Write first-run settings (unattended setup)
  ansible.builtin.copy:
    dest: "{{ vpn_root }}/wg-easy/init.env"
    mode: "0600"
    content: |
      INIT_ENABLED=true
      INIT_USERNAME=admin
      INIT_PASSWORD={{ vault_wg_easy_password }}
      INIT_HOST={{ wg_endpoint }}
      INIT_PORT={{ wg_port }}
      INIT_DNS={{ wg_ipv4_addr }},{{ wg_ipv6_addr }}
      INIT_IPV4_CIDR={{ wg_ipv4_cidr }}
      INIT_IPV6_CIDR={{ wg_ipv6_cidr }}
      INIT_ALLOWED_IPS=0.0.0.0/0,::/0
  when: not wg_easy_db_file.stat.exists
  no_log: true

- name: Check whether wg-easy's built-in iptables hooks are still set
  ansible.builtin.command: sqlite3 {{ wg_easy_db }} "select post_up || post_down from hooks_table where id='wg0'"
  register: wg_easy_hooks
  changed_when: false
  failed_when: false
  when: wg_easy_db_file.stat.exists
  check_mode: false

- name: Decide whether wg-easy may still run its built-in hooks
  ansible.builtin.set_fact:
    wg_easy_default_hooks: "{{ not wg_easy_db_file.stat.exists or (wg_easy_hooks.stdout | default('') | length > 0) }}"

- name: Load legacy iptables modules for wg-easy's one-time default hooks
  # On first start wg-easy runs its built-in iptables-legacy hooks before we can empty
  # them. Without these modules (the container can't load modules) it crash-loops.
  community.general.modprobe:
    name: "{{ item }}"
    state: present
  loop: [iptable_nat, ip6table_nat, iptable_filter, ip6table_filter]
  when: wg_easy_default_hooks | bool

- name: Start wg-easy
  ansible.builtin.command: docker compose up -d --wait --wait-timeout 120 wg-easy
  args:
    chdir: "{{ vpn_root }}"
  register: wg_easy_up
  changed_when: "'Started' in wg_easy_up.stderr or 'Recreated' in wg_easy_up.stderr or 'Created' in wg_easy_up.stderr"

- name: Wait for the unattended setup to finish
  ansible.builtin.command: sqlite3 {{ wg_easy_db }} "select setup_step from general_table"
  register: wg_easy_setup
  until: wg_easy_setup.stdout == '0'
  retries: 20
  delay: 3
  changed_when: false
  check_mode: false

- name: Remove the first-run settings file
  ansible.builtin.file:
    path: "{{ vpn_root }}/wg-easy/init.env"
    state: absent

- name: Read wg-easy's current settings
  ansible.builtin.command: >-
    sqlite3 -json {{ wg_easy_db }}
    "select i.port, i.device, h.pre_up, h.post_up, h.pre_down, h.post_down, u.host, u.port as client_port,
            u.default_dns, u.default_persistent_keepalive
     from interfaces_table i join hooks_table h on h.id = i.name join user_configs_table u on u.id = i.name
     where i.name = 'wg0'"
  register: wg_easy_current
  changed_when: false
  check_mode: false

- name: Decide whether wg-easy's settings need updating
  ansible.builtin.set_fact:
    wg_easy_drift: "{{ (wg_easy_current.stdout | from_json)[0] != wg_easy_desired }}"
  vars:
    wg_easy_desired:
      port: "{{ wg_port | int }}"
      device: "{{ public_iface }}"
      pre_up: ""
      post_up: ""
      pre_down: ""
      post_down: ""
      host: "{{ wg_endpoint }}"
      client_port: "{{ wg_port | int }}"
      default_dns: '["{{ wg_ipv4_addr }}","{{ wg_ipv6_addr }}"]'
      default_persistent_keepalive: 25

- name: Update wg-easy's settings (nftables replaces its iptables hooks)
  when: wg_easy_drift | bool
  block:
    - name: Stop wg-easy gracefully (its PostDown removes any rules it added)
      ansible.builtin.command: docker compose stop wg-easy
      args:
        chdir: "{{ vpn_root }}"
      changed_when: true

    - name: Write the settings
      ansible.builtin.command: >-
        sqlite3 {{ wg_easy_db }}
        "update hooks_table set pre_up='', post_up='', pre_down='', post_down='' where id='wg0';
         update interfaces_table set port={{ wg_port | int }}, device='{{ public_iface }}' where name='wg0';
         update user_configs_table set host='{{ wg_endpoint }}', port={{ wg_port | int }},
           default_dns='[\"{{ wg_ipv4_addr }}\",\"{{ wg_ipv6_addr }}\"]', default_persistent_keepalive=25
         where id='wg0';"
      changed_when: true

    - name: Start wg-easy with the new settings
      ansible.builtin.command: docker compose up -d --wait --wait-timeout 120 wg-easy
      args:
        chdir: "{{ vpn_root }}"
      changed_when: true

- name: Look for wg-easy iptables(-legacy) rules
  ansible.builtin.shell: |
    set -o pipefail
    docker run --rm --network host --cap-add NET_ADMIN --cap-add NET_RAW --entrypoint sh {{ stack_pinned_images['wg-easy'] }} \
      -c 'iptables-save; ip6tables-save' | grep -E '^-A ' || true
  args:
    executable: /bin/bash
  register: wg_easy_legacy
  changed_when: false
  check_mode: false

- name: Remove leftover iptables(-legacy) rules
  # Only wg-easy ever writes legacy rules on this host (Docker's iptables is off and our
  # firewall is nftables), e.g. after a crash-looping first start.
  when: wg_easy_legacy.stdout | length > 0
  block:
    - name: Flush the legacy tables
      ansible.builtin.command: >-
        docker run --rm --network host --cap-add NET_ADMIN --cap-add NET_RAW --entrypoint sh {{ stack_pinned_images['wg-easy'] }}
        -c 'for c in iptables ip6tables; do for t in nat filter; do $c -t $t -F; $c -t $t -X; done; done 2>/dev/null; true'
      changed_when: true

    - name: Confirm they are gone
      ansible.builtin.shell: |
        set -o pipefail
        docker run --rm --network host --cap-add NET_ADMIN --cap-add NET_RAW --entrypoint sh {{ stack_pinned_images['wg-easy'] }} \
          -c 'iptables-save; ip6tables-save' | grep -E '^-A ' || true
      args:
        executable: /bin/bash
      register: wg_easy_legacy_after
      changed_when: false
      failed_when: wg_easy_legacy_after.stdout | length > 0
      check_mode: false

- name: Unload the legacy iptables modules (best effort, not needed at runtime)
  ansible.builtin.command: modprobe -r ip6table_nat iptable_nat ip6table_filter iptable_filter
  register: wg_easy_rmmod
  changed_when: wg_easy_rmmod.rc == 0
  failed_when: false
  when: wg_easy_default_hooks | bool or wg_easy_legacy.stdout | length > 0

- name: Check the WireGuard interface is up
  ansible.builtin.command: wg show wg0 listen-port
  register: wg_easy_port
  changed_when: false
  failed_when: wg_easy_port.stdout | trim != (wg_port | string)
  check_mode: false
