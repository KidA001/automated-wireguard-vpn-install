---
- name: Load the WireGuard kernel module at boot (containers don't need SYS_MODULE)
  community.general.modprobe:
    name: wireguard
    state: present
    persistent: present

- name: Create the stack directories
  ansible.builtin.file:
    path: "{{ vpn_root }}/{{ item.path }}"
    state: directory
    owner: root
    group: root
    mode: "{{ item.mode }}"
  loop:
    - { path: "", mode: "0750" }
    - { path: adguard, mode: "0750" }
    - { path: adguard/conf, mode: "0700" }
    - { path: adguard/work, mode: "0700" }
    - { path: wg-easy, mode: "0700" }
    - { path: wg-easy/data, mode: "0700" }
    - { path: authelia, mode: "0700" }
    - { path: authelia/config, mode: "0700" }
    - { path: caddy, mode: "0750" }
    - { path: caddy/data, mode: "0700" }
    - { path: caddy/config, mode: "0700" }
  loop_control:
    label: "{{ vpn_root }}/{{ item.path }}"

- name: Pin container images (new installs, or a changed track in group_vars)
  ansible.builtin.command: /usr/local/sbin/vpn-maintenance --sync
  register: stack_sync
  changed_when: (stack_sync.stdout | from_json).changed
  when: not ansible_check_mode

- name: Read pinned images (dry run)
  ansible.builtin.command:
    argv: [jq, -c, "{images: (.pinned | map_values(.image))}", "{{ vpn_root }}/images.json"]
  register: stack_sync_check
  changed_when: false
  check_mode: false
  when: ansible_check_mode

- name: Remember the pinned images
  ansible.builtin.set_fact:
    stack_pinned_images: "{{ (((stack_sync.stdout | default('', true)) or stack_sync_check.stdout) | from_json).images }}"

- name: Write wg-easy's OIDC client credentials
  ansible.builtin.copy:
    dest: "{{ vpn_root }}/wg-easy/oauth.env"
    mode: "0600"
    content: |
      OAUTH_OIDC_CLIENT_ID={{ vault_oidc_client_id }}
      OAUTH_OIDC_CLIENT_SECRET={{ vault_oidc_client_secret }}
  no_log: true
  register: stack_oauth_env

- name: Make sure the extra CA bundle exists (filled in by the caddy role when needed)
  ansible.builtin.copy:
    dest: "{{ extra_ca_file }}"
    content: ""
    force: false
    mode: "0644"
  when: tls_mode != 'acme'

- name: Check whether wg-easy single sign-on has been verified
  ansible.builtin.stat:
    path: "{{ wg_easy_sso_marker }}"
  register: stack_sso_marker

- name: Decide whether wg-easy's password login stays enabled
  ansible.builtin.set_fact:
    stack_password_auth_disabled: "{{ stack_sso_marker.stat.exists }}"

- name: Write the compose file
  ansible.builtin.template:
    src: compose.yml.j2
    dest: "{{ vpn_root }}/compose.yml"
    mode: "0640"
    validate: docker compose --env-file {{ vpn_root }}/.env -f %s config --quiet
  register: stack_compose

- name: Install the stack's systemd unit
  ansible.builtin.template:
    src: vpn-stack.service.j2
    dest: /etc/systemd/system/vpn-stack.service
    mode: "0644"
  register: stack_unit

- name: Enable the stack at boot
  ansible.builtin.systemd_service:
    name: vpn-stack
    enabled: true
    daemon_reload: "{{ stack_unit is changed }}"
