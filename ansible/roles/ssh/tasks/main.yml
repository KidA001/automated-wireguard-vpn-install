---
- name: Keep the admin's SSH key authorized
  ansible.posix.authorized_key:
    user: "{{ admin_user }}"
    key: "{{ admin_pubkey }}"
    exclusive: true

- name: Keep the admin's sudo password in sync with the vault
  ansible.builtin.user:
    name: "{{ admin_user }}"
    # Same deterministic salt as bootstrap.yml, so this is idempotent.
    password: "{{ vault_sudo_password | password_hash('sha512', (vault_sudo_password | hash('sha256'))[:16]) }}"
    update_password: always
  no_log: true

- name: Rotate the root password (provider-console break-glass only)
  ansible.builtin.user:
    name: root
    password: "{{ vault_root_password | password_hash('sha512', (vault_root_password | hash('sha256'))[:16]) }}"
    update_password: always
  no_log: true

- name: Find drop-ins that would weaken our SSH settings
  ansible.builtin.find:
    paths: /etc/ssh/sshd_config.d
    patterns: "*.conf"
    excludes: "10-vpn-hardening.conf"
    contains: '(?i)^\s*(PasswordAuthentication|PermitRootLogin|KbdInteractiveAuthentication|Port)\s'
  register: ssh_conflicting

- name: Back up the current SSH configuration
  ansible.builtin.command: >-
    tar -C /etc/ssh -czf /root/.sshd-rollback.tgz sshd_config sshd_config.d
    ssh_host_rsa_key ssh_host_rsa_key.pub ssh_host_ecdsa_key ssh_host_ecdsa_key.pub
    --ignore-failed-read
  changed_when: false  # noqa: command-instead-of-module

- name: Write the hardened sshd drop-in (check mode first)
  ansible.builtin.template:
    src: 10-vpn-hardening.conf.j2
    dest: /etc/ssh/sshd_config.d/10-vpn-hardening.conf
    mode: "0600"
  check_mode: true
  register: ssh_dropin_preview

- name: Check for non-ed25519 host keys
  ansible.builtin.find:
    paths: /etc/ssh
    patterns: ["ssh_host_rsa_key*", "ssh_host_ecdsa_key*"]
  register: ssh_legacy_keys

- name: Apply SSH changes safely
  ansible.builtin.include_tasks:
    file: apply.yml
    apply:
      tags: [ssh]
  tags: [ssh]
  when: >-
    ssh_dropin_preview is changed or ssh_conflicting.files | length > 0
    or ssh_legacy_keys.files | length > 0
