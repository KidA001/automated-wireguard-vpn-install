[defaults]
inventory = ../config/inventory.yml
; ./deploy.sh always passes -i explicitly (the config dir can be overridden for tests).
roles_path = ./roles
collections_path = ../.ansible/collections
host_key_checking = True
interpreter_python = /usr/bin/python3
stdout_callback = default
callback_result_format = yaml
display_skipped_hosts = False
retry_files_enabled = False
forks = 5
timeout = 30

[ssh_connection]
# Pipelining + a persistent master connection keep a whole run to a handful of SSH
# connections, well below the server's SSH rate limit (PLAN.md §4.1, §6).
pipelining = True
ssh_args = -o ControlMaster=auto -o ControlPersist=60s -o ServerAliveInterval=15 -o StrictHostKeyChecking=yes -o IdentitiesOnly=yes
control_path_dir = ~/.ansible/cp

[privilege_escalation]
become_method = sudo
